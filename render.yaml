# Render blueprint: one free web service that serves the game and the multiplayer relay.
services:
  - type: web
    name: kartal-rts
    runtime: node
    plan: free
    buildCommand: "echo no build step"
    startCommand: node server.js
    healthCheckPath: /mp/ping
    autoDeploy: true
    envVars:
      # signs relay tickets and the TP ledger (srv/identity.mjs); generated once by Render, never in the repo
      - key: AEVUM_SECRET
        generateValue: true
